  if(pointer.x > -1e4){ pointer.moved = Math.hypot(nx-pointer.x, ny-pointer.y); }
  pointer.ax = pointer.x; pointer.ay = pointer.y;
  pointer.x = nx; pointer.y = ny;
  if(down !== undefined) pointer.down = down;
}
cv.addEventListener('pointerdown', function(e){ setPointer(e,true); });
cv.addEventListener('pointermove', function(e){ setPointer(e); }, {passive:true});
cv.addEventListener('pointerup', function(e){ pointer.down=false; });
cv.addEventListener('pointerleave', function(){ pointer.x=-1e5; pointer.y=-1e5; pointer.down=false; });

/* ---------- hud ---------- */
var hud = document.getElementById('hud');
function say(line, cls){
  var d = document.createElement('div');
  d.className='ln'; d.innerHTML = line;
  if(cls) d.style.color = cls;
  hud.appendChild(d);
  while(hud.children.length > 13) hud.removeChild(hud.firstChild);
}
function clearHud(){ hud.innerHTML=''; }

/* ---------- loop ---------- */
function frame(now){
  var t = now - t0;

  ctx.fillStyle = 'rgba(7,8,10,0.30)';
  ctx.fillRect(0,0,W,H);

  var k = 0.016, damp = 0.90;
  var cx = bodyBox.x + bodyBox.w*0.5, cy = bodyBox.y + bodyBox.h*0.38;

  for(var i=0;i<P.length;i++){
    var p=P[i];
    p.vx += (p.hx-p.x)*k; p.vy += (p.hy-p.y)*k;
    if(!reduce){
      p.vx += Math.sin(t*0.00042 + p.seed)*0.030;
      p.vy += Math.cos(t*0.00055 + p.seed*1.7)*0.030;
    }
    if(pointer.x > -1e4){
      var dx=p.x-pointer.x, dy=p.y-pointer.y, d2=dx*dx+dy*dy;
      var R = pointer.down ? 130 : 76;
      if(d2 < R*R && d2 > 0.01){
        var d=Math.sqrt(d2), f=(1-d/R)*(pointer.down?3.1:1.5);
        p.vx += dx/d*f; p.vy += dy/d*f;
      }
    }
    if(correcting && p.chest){
      var ex=p.x-cx, ey=p.y-cy, ed=Math.hypot(ex,ey)||1;
      p.vx += ex/ed*1.5 + (Math.random()-0.5)*0.8;
      p.vy += ey/ed*1.0 - 0.9;
      p.a = Math.max(0.05, p.a-0.035);
    } else if(p.a < 1){
      p.a = Math.min(1, p.a+0.02);
    }
    p.vx*=damp; p.vy*=damp;
    p.x+=p.vx; p.y+=p.vy;
  }

  // three passes so fillStyle changes stay cheap
  ctx.globalCompositeOperation='lighter';
  var j, q, sp;
  ctx.fillStyle='rgba(233,229,221,0.78)';
  for(j=0;j<P.length;j++){ q=P[j];
    sp = Math.abs(q.vx)+Math.abs(q.vy);
    if(sp<=1.1 && !(correcting&&q.chest)){ ctx.globalAlpha=q.a; ctx.fillRect(q.x,q.y,1.65,1.65); }
  }
  ctx.fillStyle='rgba(127,233,228,0.85)';
  for(j=0;j<P.length;j++){ q=P[j];
    sp = Math.abs(q.vx)+Math.abs(q.vy);
    if(sp>1.1 && !(correcting&&q.chest)){ ctx.globalAlpha=q.a*Math.min(1,sp*0.4); ctx.fillRect(q.x,q.y,1.8,1.8); }
  }
  if(correcting){
    ctx.fillStyle='rgba(255,58,22,0.9)';
    for(j=0;j<P.length;j++){ q=P[j];
      if(q.chest){ ctx.globalAlpha=q.a; ctx.fillRect(q.x,q.y,1.35,1.35); }
    }
  }
  ctx.globalAlpha=1;
  ctx.globalCompositeOperation='source-over';

  // labels
  ctx.font = '500 10px "JetBrains Mono", ui-monospace, monospace';
  if('letterSpacing' in ctx) ctx.letterSpacing = '0.18em';
  ctx.textBaseline='middle';
  for(var m=0;m<LB.length;m++){
    var L=LB[m];
    L.a = Math.min(1, L.a + 0.02);
    var lk = L.attached ? 0.05 : 0.004;
    L.vx += (L.hx-L.x)*lk; L.vy += (L.hy-L.y)*lk;
    if(pointer.x > -1e4){
      var lx=L.x-pointer.x, ly=L.y-pointer.y, ld=Math.hypot(lx,ly);
      if(ld < 74 && ld > 0.01){
        var lf = (1-ld/74)*(pointer.down?4.6:2.2);
        L.vx += lx/ld*lf; L.vy += ly/ld*lf;
        if(idx>=1 && (pointer.down || pointer.moved>2) && L.attached){
          L.attached=false;
          L.hx = L.x + (L.x<W/2?-1:1)*W*0.6; L.hy = L.y + (Math.random()-0.5)*H*0.5;
          onLabelLost();
        }
      }
    }
    L.vx*=0.9; L.vy*=0.9; L.x+=L.vx; L.y+=L.vy;

    var alpha = L.a * (L.attached ? 1 : Math.max(0, 1 - Math.abs(L.x-W/2)/(W*0.62)));
    if(alpha<=0.01) continue;
    ctx.globalAlpha = alpha;
    if(L.attached){
      ctx.strokeStyle='rgba(233,229,221,0.30)'; ctx.lineWidth=1;
      ctx.beginPath(); ctx.moveTo(L.x, L.y); ctx.lineTo(L.ax, L.ay); ctx.stroke();
      ctx.beginPath(); ctx.arc(L.ax, L.ay, 1.9, 0, 6.2832);
      ctx.fillStyle='rgba(233,229,221,0.75)'; ctx.fill();
    }
    ctx.fillStyle = L.attached ? 'rgba(233,229,221,0.92)' : 'rgba(169,139,255,0.9)';
    var w = ctx.measureText(L.txt.toUpperCase()).width;
    ctx.fillText(L.txt.toUpperCase(), L.x - w/2, L.y);
    ctx.globalAlpha=1;
  }
  if('letterSpacing' in ctx) ctx.letterSpacing='0px';

  // correction progress
  if(correcting){
    corrProgress = Math.min(1, corrProgress + 0.012);
    if(corrProgress >= 1) endCorrection(true);
  }

  requestAnimationFrame(frame);
}

/* ---------- state ---------- */
var tag=document.getElementById('tag'), bodyEl=document.getElementById('body');
var nextB=document.getElementById('next'), prevB=document.getElementById('prev');
var corrB=document.getElementById('correct'), hintEl=document.getElementById('hint');
var mnum=document.getElementById('mnum'), mstate=document.getElementById('mstate');

function pad(n){ return (n<10?'0':'')+n; }

function goTo(i){
  idx = i;
  var L = LEX[i];
  mnum.textContent = pad(i);
  tag.innerHTML = L.tag || '';
  bodyEl.innerHTML = L.html || '';
  bodyEl.classList.remove('fadein'); void bodyEl.offsetWidth; bodyEl.classList.add('fadein');
  hintEl.textContent = L.hint || '';
  prevB.disabled = (i<=1);
  corrB.hidden = (i!==3);
  gateOpenAt = performance.now(); gateForced=false;
  updateGate();

  if(i===1){
    clearHud();
    setLabelWords(['woman','masculine','lesbian','tits']);

    say('I AM A WOMAN');

function updateGate(){
  var need = false;
  if(idx===3) need = attempts < 1;
  if(idx===5) need = labelsDetached() < LB.length;
  if(gateForced) need = false;
  nextB.disabled = need;
  nextB.textContent = (idx>=6) ? 'read as text' : 'continue';
}
setInterval(function(){
  if(nextB.disabled && performance.now()-gateOpenAt > 24000){ gateForced=true; updateGate(); }
}, 1000);

function onLabelLost(){
  if(idx===5){
    var left = LB.length - labelsDetached();
    say('WORDS LEFT ON MY BODY &nbsp; ' + left);
    updateGate();
  } else {
    say('A WORD FELL OFF');
  }
}

function startCorrection(){
  if(idx!==3 || correcting) return;
  correcting=true; corrProgress=0; corrB.classList.add('on');
  document.body.classList.add('body-correcting');
  mstate.textContent='removing my tits';
  say('<b>MY CHEST DISAPPEARS</b>');
}
function endCorrection(complete){
  if(!correcting) return;
  correcting=false; corrB.classList.remove('on');
  document.body.classList.remove('body-correcting');
  if(complete){
    attempts++;
    say('MY CHEST IS GONE');
    setTimeout(function(){
      say('<i>MY BODY COMES BACK</i>');
      say('THIS DID NOT FREE ME');
      mstate.textContent='still mine';
      updateGate();
    }, 900);
  } else {
    say('I STOPPED');
  }
  updateGate();
}
['pointerdown'].forEach(function(ev){ corrB.addEventListener(ev, function(e){ e.preventDefault(); startCorrection(); }); });
['pointerup','pointerleave','pointercancel'].forEach(function(ev){ corrB.addEventListener(ev, function(){ endCorrection(false); }); });
corrB.addEventListener('keydown', function(e){ if(e.key===' '||e.key==='Enter'){ e.preventDefault(); startCorrection(); }});
corrB.addEventListener('keyup', function(e){ if(e.key===' '||e.key==='Enter'){ endCorrection(false); }});

nextB.addEventListener('click', function(){
  if(idx>=6){ openRead(); return; }
  goTo(idx+1);
});
prevB.addEventListener('click', function(){ if(idx>1) goTo(idx-1); });
document.addEventListener('keydown', function(e){
  if(e.key==='ArrowRight' && !nextB.disabled && idx<6) goTo(idx+1);
  if(e.key==='ArrowLeft' && idx>1) goTo(idx-1);
  if(e.key==='Escape') closeRead();
});

/* ---------- plain text ---------- */
var readEl=document.getElementById('read');
function buildRead(){
  var out='';
  for(var i=1;i<LEX.length;i++){
    out += '<h3>'+LEX[i].tag.replace(/<[^>]+>/g,'')+'</h3>' + LEX[i].html;
  }
  document.getElementById('readbody').innerHTML = out;
}
function openRead(){ buildRead(); readEl.classList.add('on'); }
function closeRead(){ readEl.classList.remove('on'); }
document.getElementById('textmode').addEventListener('click', openRead);
document.getElementById('closeread').addEventListener('click', closeRead);

/* ---------- boot ---------- */
document.body.classList.add('js-ready');
resize();
goTo(1);
requestAnimationFrame(frame);
})();
