  if(!h)return [0,.06];if(!h.garden?.canvas)return [0,.16];
  if(h.quickProfile?.phase==='ready')return [3,.96];
  if(h.bootTiming?.assetWaitMs!==undefined)return [3,.66+Math.min(.28,(performance.now()-h.bootTiming.moduleAt-h.bootTiming.assetWaitMs)/9000)];
  const parts=[h.foliageMaterials&&(h.foliageMaterials.loaded+(h.foliageMaterials.errors?.length||0))/(h.foliageMaterials.expected||1),h.surfaceDetail&&(h.surfaceDetail.loaded+(h.surfaceDetail.errors?.length||0))/6,h.realTrees&&+!!(h.realTrees.ready||h.realTrees.errors?.length),h.realMirrorPlants&&+!!(h.realMirrorPlants.ready||h.realMirrorPlants.error),h.gardenQuality&&+!!h.gardenQuality.assetsSettled].filter(x=>Number.isFinite(x));

 }
 function startInputs(h){
  if(quiet||!requested||!h.soundInput||!h.garden||!h.embodied?.dialog)return;
  if(!inputsStarted){inputsStarted=true;h.soundInput.enableMicrophone();h.weatherUI?.requestLocal();}
  if(!voiceWarming&&h.exhibitionAccess?.ready&&h.audio?.ready&&h.warmLocalVoice){voiceWarming=true;h.warmLocalVoice();}

 function go(){

 document.getElementById('quiet').onclick=()=>{quiet=true;hagenEntry.quiet=true;go();};enter.onclick=go;addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&!e.target.closest?.('button')){e.preventDefault();go();}});
 // Give the rooted title its first paint before evaluating the embedded engine.

  frame=document.createElement('iframe');frame.title='HAGEN night garden';frame.allow='microphone; camera; geolocation; fullscreen';
  query.set('noentrance','1');frame.src='HAGEN_V26_LISTENING_ENGINE.html?'+query;document.body.prepend(frame);
