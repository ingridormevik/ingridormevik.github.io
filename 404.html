<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Page not found — Ingrid Ormevik</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<meta name="robots" content="noindex">
<script>
    (function () {
        var t = "dark";
        try { t = localStorage.getItem("ingrid-theme") || "dark"; } catch (e) {}
        document.documentElement.setAttribute("data-theme", t);
    })();
</script>
<style>
    :root {
        --ie-bg:#07070a; --ie-text:#f3efff; --ie-muted:#aaa3b8; --ie-soft:#7f788d;
        --ie-line:rgba(255,255,255,.10); --ie-purple:#b39dfa; --ie-pink:#f9a8d4; --ie-cyan:#7ee8f9;
    }
    [data-theme="light"] {
        --ie-bg:#f5f2fb; --ie-text:#17131f; --ie-muted:#5d5668; --ie-soft:#7c7488;
        --ie-line:rgba(23,19,31,.12);
    }
    *,*::before,*::after { box-sizing:border-box; }
    html,body { height:100%; }
    body {
        margin:0; display:grid; place-items:center; padding:32px; overflow-x:hidden;
        font-family:Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont,"Segoe UI",sans-serif;
        color:var(--ie-text);
        background:
            radial-gradient(circle at 18% 14%, rgba(179,157,250,.09), transparent 34%),
            radial-gradient(circle at 78% 28%, rgba(126,232,249,.06), transparent 32%),
            var(--ie-bg);
    }
    #neural-canvas { position:fixed; inset:0; width:100%; height:100%; z-index:0; pointer-events:none; opacity:.5; }
    .wrap { position:relative; z-index:2; max-width:640px; text-align:center; }
    .eyebrow { margin:0 0 20px; color:var(--ie-cyan); font-size:.72rem; letter-spacing:.18em; text-transform:uppercase; }
    h1 {
        margin:0; font-size:clamp(4rem,16vw,9rem); line-height:.88; font-weight:300; letter-spacing:-.06em;
        background:linear-gradient(90deg,var(--ie-purple),var(--ie-pink),var(--ie-cyan));
        -webkit-background-clip:text; background-clip:text; color:transparent;
    }
    p { margin:26px auto 0; max-width:460px; color:var(--ie-muted); line-height:1.7; }
    .links { display:flex; flex-wrap:wrap; gap:12px; justify-content:center; margin-top:36px; }
    .links a {
        padding:13px 20px; border:1px solid var(--ie-line); color:var(--ie-text); text-decoration:none;
        font-size:.76rem; letter-spacing:.1em; text-transform:uppercase;
        transition:border-color .3s ease, transform .3s ease;
    }
    .links a:hover { border-color:var(--ie-purple); transform:translateY(-2px); }
    @media (prefers-reduced-motion: reduce) { #neural-canvas { display:none; } }
</style>
</head>
<body>
<canvas id="neural-canvas" aria-hidden="true"></canvas>
<div class="wrap">
    <p class="eyebrow">Error 404</p>
    <h1>Lost<br>signal.</h1>
    <p>This page does not exist — or it moved somewhere the link has not caught up with yet.</p>
    <div class="links">
        <a href="/">Home</a>
        <a href="/projects.html">Projects</a>
        <a href="/blog.html">Writing</a>
        <a href="/about.html">About</a>
    </div>
</div>
<script>
    var canvas = document.getElementById("neural-canvas");
    var ctx = canvas ? canvas.getContext("2d") : null;
    var w = 0, h = 0, nodes = [], frame;
    var palette = [[179,157,250],[249,168,212],[126,232,249],[74,222,154]];

    function resize() {
        var ratio = Math.min(window.devicePixelRatio || 1, 2);
        w = window.innerWidth; h = window.innerHeight;
        canvas.width = w * ratio; canvas.height = h * ratio;
        canvas.style.width = w + "px"; canvas.style.height = h + "px";
        ctx.setTransform(ratio, 0, 0, ratio, 0, 0);
        var count = Math.max(24, Math.min(56, Math.floor((w * h) / 26000)));
        nodes = Array.from({ length: count }, function (_, i) {
            return {
                x: Math.random() * w, y: Math.random() * h,
                vx: (Math.random() - .5) * .18, vy: (Math.random() - .5) * .18,
                r: 1.2 + Math.random() * 2.1, c: palette[i % palette.length]
            };
        });
    }

    function draw() {
        ctx.clearRect(0, 0, w, h);
        nodes.forEach(function (n) {
            n.x += n.vx; n.y += n.vy;
            if (n.x < -20) n.x = w + 20;
            if (n.x > w + 20) n.x = -20;
            if (n.y < -20) n.y = h + 20;
            if (n.y > h + 20) n.y = -20;
        });
        for (var i = 0; i < nodes.length; i++) {
            for (var j = i + 1; j < nodes.length; j++) {
                var dx = nodes[i].x - nodes[j].x, dy = nodes[i].y - nodes[j].y;
                var d = Math.sqrt(dx * dx + dy * dy), max = w < 700 ? 115 : 170;
                if (d < max) {
                    var c = nodes[i].c;
                    ctx.beginPath();
                    ctx.strokeStyle = "rgba(" + c[0] + "," + c[1] + "," + c[2] + "," + (1 - d / max) * .13 + ")";
                    ctx.lineWidth = .6;
                    ctx.moveTo(nodes[i].x, nodes[i].y); ctx.lineTo(nodes[j].x, nodes[j].y); ctx.stroke();
                }
            }
        }
        nodes.forEach(function (n) {
            ctx.beginPath();
            ctx.fillStyle = "rgba(" + n.c[0] + "," + n.c[1] + "," + n.c[2] + ",.55)";
            ctx.arc(n.x, n.y, n.r, 0, Math.PI * 2); ctx.fill();
        });
        frame = requestAnimationFrame(draw);
    }

    if (!window.matchMedia("(prefers-reduced-motion: reduce)").matches && canvas && ctx) {
        resize(); draw();
        window.addEventListener("resize", function () { cancelAnimationFrame(frame); resize(); draw(); });
    } else if (canvas) {
        canvas.style.display = "none";
    }
</script>
</body>
</html>
